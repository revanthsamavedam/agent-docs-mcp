[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-docs-mcp"
version = "0.1.0"
description = "agent-docs MCP server for GitHub Copilot integration."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
agent-docs-mcp = "agent_docs_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
